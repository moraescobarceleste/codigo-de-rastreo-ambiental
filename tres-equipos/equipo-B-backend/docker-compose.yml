# EQUIPO B - Backend (API Node.js)
services:
  backend:
    build: ../../backend
    container_name: rastreo-backend
    restart: unless-stopped
    environment:
      PORT: 3000
      # Direccion con la que el navegador abre el frontend (equipo C)
      CLIENT_URL: ${CLIENT_URL:?Define CLIENT_URL en el archivo .env}
      SESSION_SECRET: ${SESSION_SECRET:?Define SESSION_SECRET en el archivo .env}
      # Conexion a la base de datos (equipo A)
      DB_HOST: ${DB_HOST:?Define DB_HOST (IP del equipo A) en el archivo .env}
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en el archivo .env}
      DB_NAME: ${DB_NAME:-rastreo_ambiental}
    ports:
      - "3000:3000"          # permite conexiones desde el equipo C
